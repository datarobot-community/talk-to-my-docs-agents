[project]
name = "infra"
version = "0.0.1"
description = """
*Talk to My Docs** delivers a seamless **talk-to-your-docs** experience, transforming documents search and summary. Simply connect the application with your document sources. Then, ask a question, and the agents will work with you to achieve your goals.
"""
requires-python = ">=3.11, <3.14"

dependencies = [
    "datarobot>=3.8.2",
    "datarobot-pulumi-utils[llm]>=0.1.7",
    "langgraph-checkpoint>=3.0.0",
    "litellm>=1.84.0,<2.0.0",  # CVE-2026-35030, CVE-2026-35029, GHSA-69x8-hrgq-fjj8, CVE-2026-49468 (fixed in 1.84.0)
    "pulumi>=3.175.0",
    "pulumi-datarobot>=0.10.43",
    "pulumi-command>=1.1.3",
    "jinja2>=3.1.5,<4.0",
    "ipdb>=0.13.13",
    "rpdb>=0.2.0",
    "urllib3>=2.6.3",
    "langchain-core>=1.2.22,<2.0.0",  # CVE-2026-34070
    "aiohttp>=3.13.3",
    "orjson>=3.11.6",  # CVE-2025-67221
    "tornado>=6.5.5",  # CVE-2026-31958, CVE-2026-35536
    "protobuf>=5.29.6",  # CVE-2026-0994
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=6.1.1",
    "pytest>=7.4.0",
    "ruff>=0.16.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.31.0",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
exclude = ["configurations", "tests"]
