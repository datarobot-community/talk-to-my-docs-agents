---
# File generated by DataRobot CLI, regenerate using `dr task compose`
version: "3"
env:
  ENV: testing
dotenv: [".env", ".env.{{.ENV}}"]
includes:
  agent_retrieval_agent:
    taskfile: ./agent_retrieval_agent/Taskfile.yml
    dir: ./agent_retrieval_agent
  core:
    taskfile: ./core/Taskfile.yaml
    dir: ./core
  execution_environments:
    taskfile: ./execution_environments/Taskfile.yaml
    dir: ./execution_environments
    optional: true
  frontend_web:
    taskfile: ./frontend_web/Taskfile.yaml
    dir: ./frontend_web
  infra:
    taskfile: ./infra/Taskfile.yaml
    dir: ./infra
  tests:
    taskfile: ./tests/Taskfile.yaml
    dir: ./tests
    optional: true
  web:
    taskfile: ./web/Taskfile.yaml
    dir: ./web
tasks:
  default:
    desc: "ℹ️ Show all available tasks (run `task --list-all` to see hidden tasks)"
    cmds:
      - task --list --sort none
    silent: true

  start:
    desc: "💻 Prepare local development environment"
    cmds:
      - dr self update
      - dr dotenv setup --if-needed
      - task install
      - task infra:start
      - echo '✅ You are all set. Run `task dev` to start developing, or run `task deploy` to deploy to DataRobot.'

  lint:
    desc: "🧹 Run linters"
    cmds:
      - task: core:lint
      - task: agent_retrieval_agent:lint
      - task: frontend_web:lint
      - task: infra:lint
      - task: web:lint

  install:
    desc: "🛠️ Install all dependencies"
    cmds:
      - task: agent_retrieval_agent:install
      - task: core:install
      - task: frontend_web:install
      - task: infra:install
      - task: web:install

  reinstall:
    desc: "🛠️ Reinstall all dependencies (placeholder task)"

  test:
    desc: "🧪 Run tests across all components"
    cmds:
      - task: core:test
      - task: frontend_web:test
      - task: agent_retrieval_agent:test
      - task: infra:test
      - task: web:test

  dev:
    desc: "🚀 Run all services together"
    cmds:
      - |
        task web:dev-agent &
        sleep 5
        task agent_retrieval_agent:dev &
        sleep 3
        task frontend_web:dev &
        sleep 8
        echo "✅ All servers started!"
        if [[ -n "$NOTEBOOK_ID" ]]; then
          prefix="${DATAROBOT_API_ENDPOINT//api\/v2/}notebook-sessions/$NOTEBOOK_ID/ports/"
        else
          prefix="http://localhost:"
        fi
        echo "🔗 Backend: ${prefix}8080"
        echo "🔗 Frontend: ${prefix}5173"
        echo "🔗 Agent: ${prefix}8842"
        wait
  deploy:
    desc: "🚀 Deploy all services"
    env:
      AGENT_DEPLOY: "1"
    cmds:
      - task: infra:deploy
  deploy-dev:
    desc: "🚀 Deploy infrastructure and services to development"
    cmds:
      - task: infra:deploy-dev
