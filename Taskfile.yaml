---
# File generated by DataRobot CLI, regenerate using `dr task compose`
version: '3'
env:
  ENV: testing
dotenv: ['.env', '.env.{{.ENV}}']

includes:
  common:
    taskfile: ./core/task-common.yaml
    internal: true
  agent_retrieval_agent:
    taskfile: ./agent_retrieval_agent/Taskfile.yml
    dir: ./agent_retrieval_agent
  core:
    taskfile: ./core/Taskfile.yaml
    dir: ./core
  docs:
    taskfile: ./docs/Taskfile.yaml
    dir: ./docs
  execution_environments:
    taskfile: ./execution_environments/Taskfile.yaml
    dir: ./execution_environments
    optional: true
  frontend_web:
    taskfile: ./frontend_web/Taskfile.yaml
    dir: ./frontend_web
  infra:
    taskfile: ./infra/Taskfile.yaml
    dir: ./infra
  web:
    taskfile: ./web/Taskfile.yaml
    dir: ./web

tasks:
  default:
    desc: "ℹ️ Show all available tasks (run `task --list-all` to see hidden tasks)"
    silent: true
    cmds:
      - task --list --sort none

  start-non-interactive:
    cmds:
      - task: start

  start:
    desc: "💻 Prepare local development environment"
    cmds:
      - dr self update
      - dr dotenv setup --if-needed
      - task install
      - task infra:start
      - echo '✅ You are all set. Run `task dev` to start developing, or run `task deploy` to deploy to DataRobot.'
  lint:
    desc: "🧹 Run linters"
    cmds:
      - dr task run lint
  install:
    desc: "🛠️ Install all dependencies"
    cmds:
      - |
        if [ -n "$VIRTUAL_ENV" ]; then
          echo "Installing datarobot_early_access[core] into active virtualenv: $VIRTUAL_ENV"
          uv pip install "datarobot_early_access[core]>=3.13.0.2026.2.2.173832"
        else
          uv tool update-shell
          echo "Installing datarobot_early_access[core] as a uv tool"
          uv tool install --force "datarobot_early_access[core]>=3.13.0.2026.2.2.173832"
        fi
      - dr task run install
  test:
    desc: "🧪 Run tests across all components"
    cmds:
      - dr task run test

  auth-check:
    silent: true
    desc: "🔐 Check authentication prerequisites"
    cmds:
      - echo "🔐 Checking authentication.."
      - dr auth check

  dev:
    desc: "🚀 Run all services together"
    deps:
      - auth-check
    cmds:
      - drdev

  deploy:
    desc: "🚀 Deploy all services"
    env:
      AGENT_DEPLOY: "1"
    deps:
      - install
    cmds:
      - task: infra:deploy

  deploy-dev:
    desc: "🚀 Deploy infrastructure and services to development"
    deps:
      - install
    cmds:
      - task: infra:deploy-dev
